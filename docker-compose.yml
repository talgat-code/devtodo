services:
  devtodo-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtodo_password}
      POSTGRES_DB: ${POSTGRES_DB:-devtodo_db}
    volumes:
      - devtodo-postgres-data:/var/lib/postgresql/data

  devtodo-adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: devtodo-postgres
    depends_on:
      - devtodo-postgres

volumes:
  devtodo-postgres-data:
